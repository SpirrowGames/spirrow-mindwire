# Machine-readable form of the §5 classification from docs/identity-classification.md.
#
# Read by scripts/identity_findings.py to compute
#   allowed_roles = legitimate            <- the entitlement; the observation is NOT an input
#   residual      = observed \ legitimate  <- fabrication evidence (inside the write-set lock)
#   unused        = legitimate \ observed  <- right held but not exercised (report only)
# (msg-1493 §2 / §3, as corrected by msg-1585 §3: the original `observed ∩ legitimate` could only
# narrow an entitlement, never grant one, so an unregistered identity — whose claimed roles are
# dropped to null — could never bootstrap out of `observed = ∅`.)
#
# `legitimate: []` (an empty list) is the honest value for a **machine** identity — msg-1484 §2
# (Einstein endorsed msg-1485). It is NOT a stand-in for "unknown" — an identity that has not
# been classified must not appear in this file at all, and the findings script MUST list it as
# an unclassified author for a human to classify before the write half runs.
#
# Each entry cites the primary source it was decided from (a code line in this repo, or a
# module docstring), so a reader can verify the classification without walking the whole spec
# thread. The SoT for classification prose is docs/identity-classification.md; this file is
# the derived, machine-consumable form.
#
# Schema (v1):
#   identities:
#     - name:        the identity_name as it appears in code (raw form; ADR-11 normalisation
#                    is applied at query time by identity/normalize.py)
#       kind:        "participant" | "machine"
#       legitimate:  list[str] — the roles this identity may honestly claim.
#                    kind=machine MUST have legitimate=[] (invariant per docs).
#                    kind=participant MUST have len(legitimate) >= 1 (invariant).
#       independence_class:  participant only, optional at load time but REQUIRED to register
#                    (the registration constructor refuses a participant without one rather
#                    than guess — msg-1179 §5). A machine MUST NOT carry this field: its value
#                    is derived from kind by identity/registration.py::build_upsert_identity_args
#                    so the machine value string lives in one place (msg-1706 §2).
#       primary_source:  one-line pointer, "path::symbol" or "path::§heading"
#       reason:      short prose justification, cross-referenced to the doc
#
# Only the chatroom-post identities are enumerated. `spirrowgames-ops` is a GitHub
# identity (not a chatroom author) and is out of scope.

version: 1

identities:
  - name: naysayer-pr-review
    kind: participant
    legitimate: ["naysayer"]
    # msg-1704 §4 / §5: the Gemini-tier independent naysayer (Einstein endorsed msg-1705 /
    # msg-1707). NOTE the forward effect msg-1704 §5 asks every reader to see: once the
    # magickit reader that treats `independence_class == "independent"` as a naysayer lands
    # (magickit config.py migration comment), this identity is promoted alongside Einstein.
    independence_class: independent
    primary_source: "src/spirrow_mindwire/orchestrator.py::PrReviewOrchestrator.post_critique"
    reason: >-
      The `body` argument is the return value of NaysayerPrReviewDriver.review — the
      independent naysayer's critique produced by a Lexora one-shot to Gemini, relayed
      verbatim. The orchestrator's own code comment (lines 302-311) states: "The claim is
      honest: this body IS the independent naysayer's critique, relayed verbatim." Marking
      this as machinery would erase attestation on the Tier-B verdict — the very post the
      I-6 invariant exists to protect. msg-1484 §5 forbids that explicitly.

  - name: orchestrator
    kind: machine
    legitimate: []
    primary_source: "src/spirrow_mindwire/orchestrator.py::_DEFAULT_OWNER"
    reason: >-
      Passed as the `owner` on the PR-review ledger's chatroom_open_thread call
      (PrReviewOrchestrator._open_thread). The thread's opening message, the fixed
      "naysayer review request" text in fire_pr_review, is recorded with this name as its
      author. So it IS a post author: 675 posts in the live corpus (msg-5819 §3, corrected
      in msg-6019 §1 (b)). It never calls chatroom_post_message itself, and no LLM speaks
      under this name. Every post under it is template text written by the harness, so it
      carries no role because it is a machine. A participant's role is never omitted here.

  - name: pr-gate-relay
    kind: machine
    legitimate: []
    primary_source: "src/spirrow_mindwire/conductor/core.py::_PR_GATE_RELAY_AUTHOR"
    reason: >-
      The relay's own code comment (lines 627-634) states: "It is the conductor restating
      a verdict the Tier B driver produced elsewhere, and the honest value for 'which
      role authored this' is none. Claiming `naysayer` because the content came from one
      would put a role stamp on a post no reviewer wrote — manufacturing exactly the
      evidence the I-6 invariant exists to make meaningful." The relay's body is the
      conductor's own framing wrapping the driver's outcome, not the naysayer's verbatim
      critique.

  - name: conductor-relay
    kind: machine
    legitimate: []
    primary_source: "src/spirrow_mindwire/conductor/core.py::CONDUCTOR_RELAY_AUTHOR"
    reason: >-
      T-human-terminal-overuse D-1 (Bohr msg-2540, Einstein msg-2539 ACCEPT). When guard (i)
      redirects a design→implement handoff to the human terminal (a non-human, non-attested-
      naysayer author nominated the implementer), the conductor writes back one observation
      into the design thread so the head moves off the redirected token: without a write-back
      the head still says `NEXT: <implementer>`, head_skip Stage 1 does not SKIP, and the
      loop bounces forever (measured 288 times across 5 threads before this landed). The
      relay's body is the conductor's own framing — a restatement of the routing verdict —
      not any role's verbatim speech, so `legitimate = []` and no role is stamped on the
      post. Distinct from `pr-gate-relay` (Einstein msg-2539 Obj-1 fix: reusing that author
      would mix D-1 write-backs with PR-gate verdicts in the very readers that classify by
      author). msg-2540 §1-4 pins the loader constraint (kind=machine + legitimate=[]);
      giving this identity a role would violate the I-6 invariant the pr-gate-relay entry
      already documents.

  - name: pr-event-relay
    kind: machine
    legitimate: []
    primary_source: "src/spirrow_mindwire/pr_event_advance/decide.py::PR_EVENT_RELAY_AUTHOR"
    reason: >-
      T-pr-event-advances-thread (1b, Bohr msg-5901..msg-5912, Einstein msg-5911 go). Writes one
      GitHub fact into a work thread whose tail is a PR-gate relay: the PR was merged (sha), the
      PR was closed without merging, or CI ended on a CI-pending hold so the gate is re-fired
      once. The body restates GitHub state; no role spoke it, so `legitimate = []` (I-6, the
      loader's kind=machine invariant) and `independence_class` is not written (derived from
      kind by registration). Distinct from `pr-gate-relay` so the gate-records readers
      (verdict_heads / ci_route_heads / prior_advisory_approvals), which narrow to that author,
      never read a 1b post as a gate record. 1b never calls chatroom_close_thread: its
      `NEXT: none` is a handoff token, not a status close (msg-5906, R10).
