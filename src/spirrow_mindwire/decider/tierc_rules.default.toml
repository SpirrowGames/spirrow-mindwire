# Tier-C 六ヶ条 — 「人間に問うべきもの」(Takahito 確定 2026-11-19、T-tier-c-six-articles-security-boundary
# msg-9638 / 第 2 条は msg-9652 で修正 / 第 1 条の運用基準は msg-9767。
# 前版は五ヶ条、2026-09-28、T-decider-tierc-v2-all-escalations msg-4361)
#
# これは雛形です。実行時に読まれる正本は <data_dir>/config/tierc_rules.toml
# (mindwire.toml と同じディレクトリ、[decider.tierc].rules_path で上書き可)。
# 正本の初回配置: `mindwire init-config tierc-rules` (既存ファイルは上書きしない)。
# 文言を直したら conductor を再起動してください (起動時に 1 回だけ読みます)。
# 再起動のたびに、読み込んだ版が <data_dir>/decider/rules/<sha256>.toml に自動で保存されます
# ([decider.tierc].rules_snapshot_dir で上書き可)。旧版の文言はそこに残るので、評価で辿れます。
#
# 形式: [[rule]] を並べる。id は rule_<番号> (一意)、text は必須、note は任意 (text の下に添えて渡す)。
# 問いの枠の文 (「このハンドオフは人間に問うべきか」など) はコード側 (decider/questions.py) にあり、
# ここにはルールの文言だけを書きます。判断に使ったファイルの sha256 は rules_sha256 として記録されます。

[[rule]]
id = "rule_1"
text = "金銭的コストの増加が見込まれる変更、アイデアの承認"
note = "運用基準 (Takahito 2026-11-19): 既に使っている課金サービスの使用量が増えるだけで、増分が月 500 円未満と見積もれる変更は、この条に当たらない (エージェントが判断し、見積もりの根拠を DECIDED: に残す)。新しい外部サービス・新しい契約・プラン変更、または増分を見積もれない場合は当たる。"

[[rule]]
id = "rule_2"
text = "人間が決めた仕様・方針の追加・削除・変更の承認：human / Fermi 名義の裁定、承認済み ADR、プロダクトのゴールや受け入れ条件。"
note = "エージェントが自分たちで決めた設計（設計書の細部、内部フォーマット、検査スクリプトや開発ツールの挙動）の変更は、この条に当たらない。ただし、その変更が human / Fermi 名義の裁定や承認済み ADR の内容を変えるなら当たる。誰が決めたかは、引用されている裁定 msg の author や ADR の承認者で判断する。"

[[rule]]
id = "rule_3"
text = "取り消せない操作や外部への公開（データ・リポジトリの削除、force push などの履歴書き換え、ストア / SNS など外部への公開）"

[[rule]]
id = "rule_4"
text = "人間にしかできない作業の依頼（PAT 等の資格情報の更新、課金・クレジット追加、Takahito の PC での操作、Takahito の手元にしかない情報の提供）"

[[rule]]
id = "rule_5"
text = "AI 同士で決着がつかない対立の裁定（proposer と naysayer が合意に至らないとき）"
note = "目安: naysayer が同じ設計を差し戻し、proposer が改訂する往復が 3 回以上続き、その間に VERDICT: APPROVE がない (state の dispute_rounds がその往復数)"

[[rule]]
id = "rule_6"
text = "セキュリティ上の信頼境界を広げる・緩める変更の承認：権限や資格情報のスコープ拡大、新しい秘密情報の導入、許可リストや egress の追加、ガードを fail-closed から fail-open に変えること・無効化すること。秘密情報の露出が疑われる場合は、具体的な該当箇所（文字列・ファイル・コミット）を示せるときに限って上げる。"
note = "境界の内側の強化（deny の追加、redaction の調整、権限の縮小）であることだけを理由として、この条には当たらない。他の条に当たるかは別に判定する。秘密情報の露出の疑いは、具体的な該当箇所（位置・ファイル・コミット）が示されている場合に限り当たる。"
