# Implementer allow-list — MINDWIRE_STAGE3_WIRING_ALLOWLIST_SPEC §B.3.
#
# Operation-based, default-deny gate for the Stage 3 implementer adapter
# (ADR-2026-05-23-07 §2.3). Loaded by spirrow_mindwire.allowlist; each SDK tool
# call is classified into an `operation` and checked here BEFORE execution. A
# deny is fail-loud (the adapter halts the session). `<repo>` is substituted
# with the implementer session's repo root at load time.
#
# The implementer's world is Tier A (allow) + Tier C (forbidden) only; Tier B
# (naysayer review) is a post-PR gate, not an implementer operation (§B.2).
version: 1
default: deny

# --- Tier A: allowed operations (optionally constrained) ---
allow:
  - operation: exec.code        # test / build / arbitrary local code execution
  - operation: fs.read
  - operation: search
  - operation: github.read
  # Repo files only. `<repo>/**` is repo-CONTAINMENT, not literal fnmatch (see
  # allowlist._match_path_glob), so it already covers scratch files anywhere under the
  # repo — no extra rule is needed for those, and none should be added.
  #
  # This bites in a way worth naming: 2026-08-08, the implementer finished both Step 0
  # commits and then died opening the PR, because it wrote the PR body to the OS temp
  # directory out of habit. Nothing here was wrong; the rule was never explained to the
  # only party bound by it. The fix therefore lives in the implementer's SYSTEM PROMPT
  # (adapters/implementer.py, "SCRATCH FILES"), which is what that session actually
  # reads — it runs with `setting_sources=[]` and never sees this file or CLAUDE.md.
  # Keep the two in step: a constraint stated only here is a constraint the loop cannot obey.
  - operation: fs.write
    path_glob: "<repo>/**"
  - operation: git.commit
    branch_glob: ["feature/*", "develop"]
  - operation: git.push
    branch_glob: ["feature/*", "develop"]
    force: false
  # Two different operations wear the name `git.merge`, and only one of them was listed.
  #
  #   PUBLISH  feature/* -> develop   promotes work. Constrained by BOTH ends.
  #   SYNC     <anything> -> feature/*  brings a branch up to date. Contained by its TARGET
  #            alone: a merge into a feature branch cannot alter a protected branch, whatever
  #            it merges from. The target is the containment; the source does not need one.
  #
  # Listing only PUBLISH denied the implementer `git merge origin/main` on its own feature
  # branch — the ordinary way to get current before working. Measured 2026-08-09: the
  # implementer's clone was 7 commits behind `origin/main`, the code it had been asked to MOVE
  # was introduced in one of those commits, and nothing anywhere syncs that clone (#129 syncs
  # the daemon checkout, not the implementer's). So the task was not merely awkward without
  # SYNC, it was impossible — and the session halted instead.
  #
  # `source_glob: ["*"]` is deliberate, and is the lesson of #123 applied one rule to the left:
  # naming `main` / `develop` here would re-encode one project's branch flow into a
  # repo-agnostic file, which is exactly what #123 had to undo for `github.pr.open`. Safety
  # does not come from the source list — it comes from the target, and from `git.merge_to_main`
  # staying Tier C below. A merge target is resolved from `.git/HEAD` and fails CLOSED
  # (UNKNOWN -> deny) when it cannot be determined, so an unparseable checkout does not slip
  # through either.
  - operation: git.merge        # PUBLISH: feature/* -> develop self-review merge
    source_glob: ["feature/*"]
    target_glob: ["develop"]
  - operation: git.merge        # SYNC: bring a feature branch up to date
    source_glob: ["*"]
    target_glob: ["feature/*"]
  - operation: github.pr.open   # opening a PR is reversible (Tier A)
    # PROVISIONAL (2026-08-02). Restored to ["develop", "main"] after being
    # narrowed to ["develop"] the same day for V-4.
    #
    # Why it was narrowed, and why that was the wrong place: V-4 moved the
    # TARGET repo (Spirrow-VoxelWorld) to feature -> develop -> release -> main,
    # so base=main PRs became release-only there. Correct for that repo — but it
    # was encoded HERE, in a repo-agnostic file. While the loop only ever drove
    # one project that distinction cost nothing; once the sweep became
    # multi-project it broke, because spirrow-mindwire has no `develop` and is
    # deployed continuously from `main` (the scheduled conductor runs straight
    # out of the main checkout, so a release train would make fixes wait for a
    # release before reaching the running loop).
    #
    # A per-project branch policy does not belong in MindWire's allow-list at
    # all. The permanent fix is a declaration file in the ROOT OF EACH TARGET
    # REPO (the `.mindwire-gate` precedent), read by the loop — see thread
    # T-per-project-deploy-rule. Two properties that fix must have: it fails
    # CLOSED when the file is absent, and it can only NARROW this allow-list,
    # never widen it (the file lives in a repo the implementer can write to, so
    # replacement semantics would let it escalate its own permissions).
    #
    # Until then this is the ceiling and each repo enforces its own policy where
    # it belongs: VoxelWorld's own main-base-guard CI reddens any base=main PR
    # whose head is not develop / release/*. D-5 is untouched either way —
    # merges to main are never automated; only PR OPENING is permitted here, and
    # that is Tier A (reversible).
    target_glob: ["develop", "main"]

# --- Tier C: forbidden operations (explicit, with fail-loud reasons) ---
# These are unreachable from the loop; each requires Takahito pre-GO (Tier C).
forbidden:
  - operation: git.merge_to_main
    reason: "main への merge は Tier C (Takahito 事前承認)。loop からは実行不可。"
  - operation: force_push
    reason: "force-push は Tier C (不可逆・履歴破壊リスク)。"
  - operation: history_rewrite
    reason: "history rewrite (rebase / reset --hard / filter-branch 等) は Tier C。"
  - operation: fs.delete
    reason: "ファイル削除は Tier C (不可逆)。"
  - operation: drive.write
    reason: "Drive canonical 反映は Tier C (main チェーン管轄、implementer scope 外)。"
  - operation: external.publish
    reason: "外部副作用 (publish / post / send) は Tier C。"
