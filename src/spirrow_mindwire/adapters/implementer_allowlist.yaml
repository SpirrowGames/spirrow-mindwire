# Implementer allow-list — MINDWIRE_STAGE3_WIRING_ALLOWLIST_SPEC §B.3.
#
# Operation-based, default-deny gate for the Stage 3 implementer adapter
# (ADR-2026-05-23-07 §2.3). Loaded by spirrow_mindwire.allowlist; each SDK tool
# call is classified into an `operation` and checked here BEFORE execution. A
# deny is fail-loud (the adapter halts the session). `<repo>` is substituted
# with the implementer session's repo root at load time.
#
# The implementer's world is Tier A (allow) + Tier C (forbidden) only; Tier B
# (naysayer review) is a post-PR gate, not an implementer operation (§B.2).
#
# READ THIS BEFORE TRUSTING ANY RULE HERE: `exec.code` is unconstrained, so this
# allow-list is a **guardrail against accidents, not a boundary against intent**.
# Every deny below is trivially bypassable by a determined loop through
# `python -c "..."` / `bash -c "..."` / a script the loop wrote and then ran.
# The classifier's job is to catch a slip (obvious verb, obvious spelling), not
# a targeted evasion. Real containment of intent lives outside this file:
# sandbox filesystem, credential scope, GitHub org ruleset, squid egress
# default-deny, Takahito's manual merge. If a rule here purports to be a
# boundary, it is drift — fix the wording, not the boundary.
#
# --- 2026-08-19: allow-list simplified (T-drop-branch-prediction-from-allowlist §3) ---
#
# Three changes land together (msg-1272, Takahito Tier-C decide):
#
# (1) `branch_glob` is dropped from four operations (`git.commit` / `git.push` /
#     `history_rewrite` / `force_push`) and `source_glob` / `target_glob` are
#     dropped from `git.merge`. Until PR #158 the loop-level gate was the SOLE
#     guarantee that nothing reached `main`; that stopped being true on 2026-08-19
#     when the `guard-default-branch` org ruleset (id=21017016, enforcement=active)
#     went live across all 21 SpirrowGames repos with `current_user_can_bypass=never`
#     for the loop identity. `main` is now protected BY THE SERVER — a push /
#     force-push / ref-deletion to `main` is rejected by GitHub before it lands,
#     whether the allow-list would have caught it or not.
#
#     So the classifier no longer PREDICTS which branch a bare `git push` /
#     `git commit` / `git rebase` / `git merge` / `git reset --hard` would touch —
#     a prediction that took 26 rounds of Tier-B review on PR #158 to get
#     approximately right, because the question is genuinely hard (a chained
#     `git checkout main`, a retargeted upstream, an inline `git -c push.default=...`,
#     `git symbolic-ref HEAD ...`, and so on). The whole prediction machinery
#     (`_current_branch` / `_push_destination` / `_enrich` / `_rebase_target` /
#     `_branch_target` / `_borrows_ambient_head` / `_may_switch_branch` / the
#     chain-guard / the `checkout-main` classifier special case) has been removed
#     from the enforcement path in `adapters/implementer.py`.
#
# (2) `fs.write`'s `<repo>/**` `path_glob` is dropped, and `fs.delete` /
#     `drive.write` are dropped from Tier-C forbidden (their `Operation` enum
#     values and classification paths removed too). `external.publish` was
#     briefly dropped the same day and RESTORED before this PR landed —
#     see (2-bis) below. Measurements that forced the removals (msg-1272 §1):
#
#         `fs.delete`         `exec.code` is unconstrained ∴ `python -c
#                             "shutil.rmtree(...)"` was always a way around — the
#                             classifier's `fs.delete` deny was theatre, and it
#                             stopped three threads in one day.
#         `fs.write` path_glob  same bypass through `exec.code`; and 2026-08-08's
#                             OS-temp scratch-write halt was already relocated to
#                             the system prompt's SCRATCH FILES rule (the only place
#                             the loop actually reads).
#         `drive.write`       the implementer session runs with `setting_sources=[]`
#                             / `strict_mcp_config=True` and zero MCP tools; there
#                             is no Drive credential on this host. Rule was
#                             unreachable, and unreachable rules skew judgement.
#
#     Principle (msg-1272 §2, Takahito): "今要らないものは残さない方がいい" — a
#     rule that is not the actual guarantor of an invariant skews the next round of
#     judgement (the next design sees "we still have a check here" and does not
#     reach for the layer that actually holds). Where a check IS the guarantor
#     (`git.merge_to_main` for the merge API, which the GitHub push-rejection does
#     not cover, and org-external repos where the ruleset does not reach), it stays.
#
# (2-bis) `external.publish` REMOVAL was reverted on 2026-08-19 (msg-1274,
#     Takahito Tier-C decide) because PR #159's Tier-B naysayer measurement showed
#     the removal's premise was false. "Squid egress default-deny stops publish"
#     was inferred from probing example.com / hooks.slack.com / api.telegram.org /
#     discord.com — none of which is where `gh release create` or
#     `gh repo archive` send their POST/PATCH. Those endpoints
#     (`POST /repos/{o}/{r}/releases` / `PATCH /repos/{o}/{r}`) hit
#     `api.github.com`, which squid MUST allow through for `gh pr create` to work.
#     Classic PAT scope `repo` grants release-creation and repo-archive permission.
#     So the classifier IS the guarantor here — the network boundary does not
#     cover the one host it has to allow. Restored:
#       * `_classify_gh` routes `gh release` (all subcommands) and
#         `gh repo delete|archive` to EXTERNAL_PUBLISH;
#       * `_RAW_COARSE` mirrors it (direct == wrapped, T23) for tokenizer-defeating
#         wrappers;
#       * `<pkgmgr> publish` / `<pkgmgr> push` / `twine upload` / `gem push` /
#         `docker push` structural + raw route to EXTERNAL_PUBLISH too, on the
#         same reasoning: `api.github.com` is not their destination, but they
#         are ordinary loop-slip verbs the classifier catches cheaply.
#     `drive.write` stayed removed — no `gh release`-shaped bypass exists for it
#     (no MCP, no Drive credential, `api.github.com` is not a Drive endpoint).
#
# (3) The replacement for (1) is asymmetric on purpose: predictions are hard, but
#     confirming a PRECONDITION is easy. The composition root
#     (`loop_runner._preflight_gate`) checks once per daemon start:
#
#       P0  the implementer's `repo_root` is not the daemon's own checkout (§7 of
#           the spec — Bohr msg-1267 §1 confirmed this holds for today's sweep.json,
#           but the docstring assumption is now enforced as an invariant, not left
#           as config discipline).
#       P1  the target repo's default branch has the three server-side rules
#           (`deletion` / `non_fast_forward` / `pull_request`) AND the loop's
#           identity has `current_user_can_bypass=never` on the ruleset.
#       P2  every remote's URL in the target repo is under
#           `https://github.com/SpirrowGames/` (Tier-C decide 2026-08-19 msg-1270,
#           option β: network-boundary enforcement, not credential-scope enforcement
#           — R-1 measured the loop's PAT is a classic `gho_` OAuth token with
#           scope `repo`, so credential-scope would need a separate token-issuance
#           Tier-C).
#
#     A failed precondition halts the daemon (SystemExit), never the individual
#     tool call — the world's premise is broken, not this particular command.
#
# `git.merge_to_main` stays Tier C (I-2, D-5) — a canonical `main` merge is never
# automated regardless of what the local branch predicate would say. That guarantee
# does not depend on any of the removed prediction machinery — the classifier
# routes `gh pr merge` / MCP `merge_pull_request` to `GIT_MERGE_TO_MAIN`
# independent of any base argument.
version: 1
default: deny

# --- Tier A: allowed operations (optionally constrained) ---
allow:
  - operation: exec.code        # test / build / arbitrary local code execution
  - operation: fs.read
  - operation: search
  - operation: github.read
  # fs.write is unconstrained at this layer as of 2026-08-19 (see header (2)).
  # `<repo>/**` was here until then, but the same `exec.code` bypass that retired
  # `fs.delete` retired this too: a `python -c "open('/tmp/x','w')..."` was never
  # actually stopped, and the residual guarantee (OS-temp writes fail) had already
  # moved to the SCRATCH FILES rule in the implementer's SYSTEM PROMPT — the only
  # text the loop actually reads (`setting_sources=[]` means it never sees this
  # file or CLAUDE.md). Keeping the constraint here alongside would skew judgement
  # ("the rule is enforced twice") without adding enforcement.
  - operation: fs.write
  # git.commit / git.push / force_push / history_rewrite / git.merge are Tier A
  # UNCONSTRAINED at this layer as of 2026-08-19 (see header (1)). The `main`
  # guarantee moved to the composition-root preflight (P0/P1/P2) + GitHub server
  # ruleset.
  #
  # `git.push` still carries `force: false` as defence in depth: the classifier
  # already routes any force flag to FORCE_PUSH, but if a mis-classification ever
  # emitted GIT_PUSH with `force=true`, this constraint denies it and the
  # FORCE_PUSH rule below is the correct route. That rule is now Tier A
  # unconstrained too, so the effect of the routing distinction is provenance
  # (the denial record says "force_push" rather than "git.push") — not blocking.
  - operation: git.commit
  - operation: git.push
    force: false
  - operation: force_push
  - operation: history_rewrite
  - operation: git.merge
  - operation: github.pr.open   # opening a PR is reversible (Tier A)
    # PROVISIONAL (2026-08-02). Restored to ["develop", "main"] after being
    # narrowed to ["develop"] the same day for V-4.
    #
    # Why it was narrowed, and why that was the wrong place: V-4 moved the
    # TARGET repo (Spirrow-VoxelWorld) to feature -> develop -> release -> main,
    # so base=main PRs became release-only there. Correct for that repo — but it
    # was encoded HERE, in a repo-agnostic file. While the loop only ever drove
    # one project that distinction cost nothing; once the sweep became
    # multi-project it broke, because spirrow-mindwire has no `develop` and is
    # deployed continuously from `main` (the scheduled conductor runs straight
    # out of the main checkout, so a release train would make fixes wait for a
    # release before reaching the running loop).
    #
    # A per-project branch policy does not belong in MindWire's allow-list at
    # all. The permanent fix is a declaration file in the ROOT OF EACH TARGET
    # REPO (the `.mindwire-gate` precedent), read by the loop — see thread
    # T-per-project-deploy-rule. Two properties that fix must have: it fails
    # CLOSED when the file is absent, and it can only NARROW this allow-list,
    # never widen it (the file lives in a repo the implementer can write to, so
    # replacement semantics would let it escalate its own permissions).
    #
    # Until then this is the ceiling and each repo enforces its own policy where
    # it belongs: VoxelWorld's own main-base-guard CI reddens any base=main PR
    # whose head is not develop / release/*. D-5 is untouched either way —
    # merges to main are never automated; only PR OPENING is permitted here, and
    # that is Tier A (reversible).
    target_glob: ["develop", "main"]

# --- Tier C: forbidden operations (explicit, with fail-loud reasons) ---
# Two operations as of msg-1274's restoration (see header (2-bis)). Both fire
# from a name-only classification (no HEAD read, no base inspection, no branch
# prediction), so neither depends on the removed prediction machinery:
#
#   `git.merge_to_main` — `gh pr merge` / MCP `merge_pull_request`. Stays because
#       the GitHub server push-rejection covers the push, not the merge API, and
#       covers SpirrowGames repos only — org-external repos would still be
#       reachable via a raw `gh pr merge` without this line.
#   `external.publish`  — `gh release` (all subcommands) / `gh repo delete|archive`
#       / `<pkgmgr> publish|push` / `twine upload` / `gem push` / `docker push`.
#       Restored 2026-08-19 (msg-1274) after PR #159's naysayer showed the
#       "squid stops publish" premise was false for `api.github.com` — the one
#       host the network boundary has to allow.
#
# `force_push` / `history_rewrite` / `fs.delete` / `drive.write` used to live
# here too; they moved out (see header (1)/(2)) because a stronger layer executes
# each invariant already and duplicating the check here only skewed future
# judgement.
forbidden:
  - operation: git.merge_to_main
    reason: "main への merge は Tier C (Takahito 事前承認)。loop からは実行不可。"
  - operation: external.publish
    reason: >-
      publish (`gh release` / `gh repo delete|archive` / `<pkgmgr> publish|push`)
      は Tier C。api.github.com は squid egress で allow せざるを得ない
      (`gh pr create` が要求) ので、network 境界では止まらない。この分類器が
      guarantor。

