[project]
name = "spirrow-mindwire"
version = "0.0.1"
description = "AI エージェント間通信ハブ。Claude.ai と Claude Code 間のチャットをファイルベース I/O で自動中継する独立 MCP サーバ。"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Takahito (SpirrowGames)", email = "takayan0908@gmail.com" }
]

dependencies = [
  "watchdog>=4.0",
  "python-ulid>=2.0",
  "pyyaml>=6.0",
  "mcp>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "claude-agent-sdk>=0.1.0,<0.2",
  "structlog>=24.1",
  # mindwire-mcp-server (Phase 1 Feature 3-A): direct ASGI usage of the
  # Starlette app produced by FastMCP, served by uvicorn. Both are
  # transitively pulled in by ``mcp``, but they're listed explicitly
  # here per [[feedback_decoupling_preference]] — we import them
  # directly, so we own the contract.
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
]

[project.scripts]
mindwire-watcher = "spirrow_mindwire.watcher:main"
mindwire-loop = "spirrow_mindwire.loop_runner:main"
mindwire-mcp = "spirrow_mindwire.mcp_server:main"
mindwire-mcp-server = "spirrow_mindwire.mcp_write_server.http:main"
mindwire = "spirrow_mindwire.cli:main"
mindwire-migrate-v1-to-v2 = "spirrow_mindwire.migration.v1_to_v2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spirrow_mindwire"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["watchdog.*", "ulid.*", "mcp.*", "claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --strict-markers -m "not manual"'
markers = [
  "manual: real-subprocess e2e, skipped in CI by default (addopts -m 'not manual'); run via the Phase 1 dogfooding-resume gate with `uv run pytest -m manual` (Feature 3-A sub-PR 3 D3-2, msg-131 §3)",
]
