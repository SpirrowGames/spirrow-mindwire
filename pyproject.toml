[project]
name = "spirrow-mindwire"
version = "0.0.1"
description = "AI エージェント間通信ハブ。Claude.ai と Claude Code 間のチャットをファイルベース I/O で自動中継する独立 MCP サーバ。"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Takahito (SpirrowGames)", email = "takayan0908@gmail.com" }
]

dependencies = [
  "watchdog>=4.0",
  "python-ulid>=2.0",
  "pyyaml>=6.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
]

[project.scripts]
mindwire-watcher = "spirrow_mindwire.watcher:main"
mindwire-mcp = "spirrow_mindwire.mcp_server:main"
mindwire = "spirrow_mindwire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spirrow_mindwire"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["watchdog.*", "ulid.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
